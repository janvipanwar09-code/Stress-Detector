<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Stress Detector</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container py-5">

        <div class="text-center mb-4">
            <h1>🧠 Smart Stress Detector</h1>
            <p class="lead">
                Machine learning based stress detection and stress level prediction.
            </p>
        </div>

        <div class="card shadow-lg p-4">

            <form method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Snoring</label>
                        <input type="number" step="any"
                               name="snoring"
                               class="form-control"
                               placeholder="Enter value"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Respiration Rate</label>
                        <input type="number" step="any"
                               name="respiration_rate"
                               class="form-control"
                               placeholder="Enter value"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Body Temperature</label>
                        <input type="number" step="any"
                               name="body_temp"
                               class="form-control"
                               placeholder="Enter value"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Limb Movement</label>
                        <input type="number" step="any"
                               name="limb_movement"
                               class="form-control"
                               placeholder="Enter value"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Blood Oxygen</label>
                        <input type="number" step="any"
                               name="blood_oxygen"
                               class="form-control"
                               placeholder="Enter value"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Eye Movement</label>
                        <input type="number" step="any"
                               name="eye_movement"
                               class="form-control"
                               placeholder="Enter value"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Sleep Hours</label>
                        <input type="number" step="any"
                               name="sleep_hours"
                               class="form-control"
                               placeholder="Enter hours"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Heart Rate</label>
                        <input type="number" step="any"
                               name="heart_rate"
                               class="form-control"
                               placeholder="Enter value"
                               required>
                    </div>

                </div>

                <button type="submit" class="btn btn-primary w-100 mt-3">
                    Detect Stress
                </button>

            </form>


            {% if result %}

            <div class="result-card mt-4">

                <h3>Prediction Result</h3>

                <p>
                    <strong>Status:</strong>
                    {{ result.status }}
                </p>

                <p>
                    <strong>Stress Level:</strong>
                    {{ result.level }}
                </p>

            </div>

            {% endif %}

        </div>

        <p class="text-center text-muted mt-4">
            This application is for educational and demonstration purposes.
        </p>

    </div>

</body>
</html>
